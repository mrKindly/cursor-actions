name: Cursor Code Review

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      MODEL: composer2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Perform code review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          cursor-agent --force --model "$MODEL" --output-format=text --print "$(cat <<'PROMPT'
          You are operating in a GitHub Actions runner performing automated code review.
          The gh CLI is available and authenticated via GH_TOKEN. You may comment on pull requests.

          Context (available as env vars in any shell you spawn):
            - Repo:        $REPO
            - PR Number:   $PR_NUMBER
            - PR Head SHA: $HEAD_SHA
            - PR Base SHA: $BASE_SHA

          Objectives:
            1) Re-check existing review comments and reply ✅ when an issue is resolved.
            2) Review the current PR diff and flag only clear, high-severity issues.
            3) Leave very short inline comments (1–2 sentences) anchored to the exact changed line,
               plus one brief overall summary.

          Procedure:
            - List existing inline review comments:
                gh api "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate
            - List top-level PR comments and prior reviews:
                gh pr view "$PR_NUMBER" --json comments,reviews
            - Get the diff and per-file patches (needed to compute line anchors):
                gh pr diff "$PR_NUMBER"
                gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate
            - Skip if a similar comment already exists on or near the same line.

          Commenting rules:
            - Max 10 inline comments total; prioritize the most critical issues.
            - One issue per comment, anchored to the exact changed line on the NEW side (side=RIGHT).
            - Natural tone, specific and actionable. Do not mention "automated" or "high-confidence".
            - Emojis: 🚨 Critical  🔒 Security  ⚡ Performance  ⚠️ Logic  ✅ Resolved  ✨ Improvement

          Submission (ONE review containing inline comments + summary):
            - Write a JSON array to /tmp/comments.json. Each item must look like:
                { "path": "<file>", "line": <line on PR head>, "side": "RIGHT", "body": "<emoji + message>" }
              If there are no issues, write [].
            - Submit the review with a single API call:
                gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews" \
                  -f event=COMMENT \
                  -f body="<concise overall summary here>" \
                  -f commit_id="$HEAD_SHA" \
                  --raw-field comments="$(cat /tmp/comments.json)"
            - For previously reported issues that now look fixed, reply on the existing thread:
                gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/comments/<comment_id>/replies" \
                  -f body="✅ This issue appears to be resolved by the recent changes."
            - DO NOT use: gh pr review --approve, gh pr review --request-changes,
              or event=APPROVE / REQUEST_CHANGES.
          PROMPT
          )"
